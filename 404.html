<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Are-Cold</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e2436">


<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #0e2436;
    --ink-soft: #1b3b54;
    --blue-300: #9dbcd8;
    --text: #dce8f0;
    --muted: #9db4c4;
    --accent: #e07a29;
    --whatsapp: #25d366;
    --whatsapp-dark: #1da851;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, var(--ink-soft) 0%, transparent 70%),
      var(--ink);
    overflow-x: hidden;
    position: relative;
  }

  /* Nieve cayendo (decorativa) */
  .snow{ position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .snow i{
    position: absolute; top: -12px;
    width: var(--s); height: var(--s);
    left: var(--x);
    border-radius: 50%;
    background: #fff;
    opacity: var(--o);
    animation: fall var(--d) linear var(--delay) infinite;
  }
  @keyframes fall{
    to{ transform: translate3d(var(--drift), 108vh, 0); }
  }

  main{
    position: relative;
    width: 100%;
    max-width: 560px;
    text-align: center;
    display: grid;
    gap: 1.6rem;
    justify-items: center;
  }
  .logo{ width: min(320px, 78vw); height: auto; }

  .badge{
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .4rem .9rem;
    border: 1px solid rgba(157,188,216,.35);
    border-radius: 999px;
    font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--blue-300);
  }
  .badge::before{
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 50%{ opacity: .35; transform: scale(.8); } }

  h1{
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.1;
    color: #fff;
    text-wrap: balance;
  }
  h1 em{ font-style: normal; color: var(--accent); }
  .lead{ font-size: 1.05rem; line-height: 1.6; color: var(--text); max-width: 46ch; text-wrap: pretty; }

  .btn{
    display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
    min-height: 52px; padding: .8rem 1.6rem;
    border-radius: 999px;
    background: var(--whatsapp); color: #06301a;
    font-weight: 700; font-size: 1.02rem; text-decoration: none;
    box-shadow: 0 8px 24px rgba(37,211,102,.25);
    transition: background .2s, transform .2s;
  }
  .btn:hover{ background: var(--whatsapp-dark); transform: translateY(-1px); }
  .btn svg{ width: 22px; height: 22px; }
  a:focus-visible{ outline: 3px solid var(--accent); outline-offset: 3px; }

  .info{
    width: 100%;
    display: grid; gap: .9rem;
    padding: 1.4rem 1.2rem;
    border: 1px solid rgba(157,188,216,.2);
    border-radius: 18px;
    background: rgba(255,255,255,.04);
    font-size: .95rem; line-height: 1.5; color: var(--muted);
  }
  .info strong{ display: block; color: #fff; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .1rem; }
  @media (min-width: 560px){
    .info{ grid-template-columns: 1fr 1fr; text-align: left; padding: 1.4rem 1.6rem; }
  }

  .social{ display: flex; gap: .8rem; justify-content: center; }
  .social a{
    display: grid; place-items: center; width: 44px; height: 44px;
    border: 1px solid rgba(157,188,216,.3); border-radius: 50%;
    color: var(--text); transition: background .2s, color .2s;
  }
  .social a:hover{ background: #fff; color: var(--ink); }
  .social svg{ width: 21px; height: 21px; }

  .actions{ display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; }
  a.btn--home, a.btn--ghost{ box-shadow: none; color: #fff; }
  a.btn--home{ background: var(--accent); }
  a.btn--home:hover{ background: #c96a1f; }
  a.btn--ghost{ background: transparent; border: 1px solid rgba(157,188,216,.4); color: var(--text); }
  a.btn--ghost:hover{ background: rgba(255,255,255,.08); }
  .code{ display: none; }

  footer{ font-size: .8rem; color: var(--muted); }
  footer a{ color: var(--blue-300); }

  @media (prefers-reduced-motion: reduce){
    .snow{ display: none; }
    .badge::before{ animation: none; }
    .btn{ transition: none; }
  }
</style>
</head>
<body>

<div class="snow" aria-hidden="true" id="snow"></div>

<main>
  <img class="logo" src="/assets/logo-arecold.png?v=2" alt="Are-Cold" width="1073" height="223">

  <span class="badge">Error 404</span>

  <h1>Esta página <em>no existe</em></h1>
  <p class="lead">Puede que el link haya cambiado o esté mal escrito. Volvé al inicio, mirá el catálogo o escribinos y te ayudamos a encontrar lo que buscás.</p>

  <div class="actions">
    <a class="btn btn--home" href="/">Ir al inicio</a>
    <a class="btn btn--ghost" href="/catalogo">Ver el catálogo</a>
  </div>

  <a class="btn" id="wa" href="https://wa.me/5492326422390?text=Hola!%20Quer%C3%ADa%20hacer%20una%20consulta." target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5c-4.7 0-8.5 3.8-8.5 8.5 0 1.5.4 2.9 1.1 4.2L3.5 20.5l4.5-1.1c1.2.6 2.6 1 4 1 4.7 0 8.5-3.8 8.5-8.5S16.7 3.5 12 3.5Z"/><path d="M9 10.2c.3 2 2.6 4.3 4.6 4.6.8.1 1.4-.5 1.7-1.1.1-.3 0-.6-.3-.8l-1.3-.9c-.3-.2-.6-.1-.8.1l-.4.5c-.9-.5-1.7-1.3-2.2-2.2l.5-.4c.2-.2.3-.5.1-.8l-.9-1.3c-.2-.3-.5-.4-.8-.3-.6.3-1.2.9-1.2 1.6Z" fill="currentColor" stroke="none"/></svg>
    Escribinos por WhatsApp
  </a>

  <footer>© <span id="year"></span> Are-Cold · Sitio desarrollado por <a href="https://moscode.com.ar" target="_blank" rel="noopener">Moscode</a></footer>
</main>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  // Copos de nieve decorativos (se omiten si la persona pidió menos movimiento)
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var box = document.getElementById("snow"), n = window.innerWidth < 600 ? 28 : 55, html = "";
    for (var i = 0; i < n; i++) {
      var s = (2 + Math.random() * 4).toFixed(1);
      html += '<i style="--s:' + s + 'px;--x:' + (Math.random() * 100).toFixed(1) + '%;--o:' + (0.25 + Math.random() * 0.5).toFixed(2) +
        ';--d:' + (9 + Math.random() * 12).toFixed(1) + 's;--delay:-' + (Math.random() * 20).toFixed(1) + 's;--drift:' + ((Math.random() - 0.5) * 80).toFixed(0) + 'px"></i>';
    }
    box.innerHTML = html;
  }
</script>
</body>
</html>
